services:
  - type: web
    name: api-videojuegos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: api-videojuegos-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: API_KEY
        sync: false

databases:
  - name: api-videojuegos-db
    databaseName: videojuegos_db
    user: videojuegos_user
    plan: free
    postgresMajorVersion: "16"
