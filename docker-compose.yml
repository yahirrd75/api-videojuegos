services:
  postgres:
    image: postgres:16-alpine
    container_name: api-videojuegos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videojuegos_db}
      POSTGRES_USER: ${POSTGRES_USER:-videojuegos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videojuegos_local_2026}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - videojuegos_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  videojuegos_pgdata:
